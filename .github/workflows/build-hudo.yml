name: Build 虎Do

on:
  push:
    branches: [kudo-base]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hudo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build hudo debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;27.0.12077973 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false

      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.1 --profile minimal --target aarch64-linux-android
          rustup default 1.96.1

      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_PATH: ci/hudo-debug.p12
          DEBUG_STORE_PASSWORD: android
          DEBUG_KEY_ALIAS: hudo-debug
          DEBUG_KEY_PASSWORD: android
          DEBUG_KEYSTORE_TYPE: PKCS12
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -PversionCode=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: hudo-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 每次 kudo-base 构建覆盖更新 nightly-kudo 资产：
      # https://github.com/sduliu/huzai/releases/download/nightly-kudo/hudo-debug.apk
      - name: Rename APK to fixed name
        run: cp app/build/outputs/apk/debug/app-debug.apk hudo-debug.apk

      - name: Publish to nightly-kudo release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-kudo
          name: Nightly 虎Do 构建
          prerelease: true
          files: hudo-debug.apk
